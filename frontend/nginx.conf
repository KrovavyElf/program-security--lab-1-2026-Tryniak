server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ЗАХИСТ У ГЛИБИНУ (виправлення після аудиту): основна точка входу — сервіс nginx у
    # docker-compose.yml, який проксує /api і /hubs на backend, а порт цього фронтенд-контейнера
    # більше не публікується назовні напряму (раніше публікувався як 5173:80, в обхід
    # reverse-proxy — якщо запит до /api/* потрапляв сюди, try_files мовчки повертав index.html
    # замість JSON, і застосунок ламався непомітно). Але якщо цей контейнер колись запустять
    # окремо (наприклад, інший спосіб деплою чи k8s-інгрес без spільного nginx) — він тепер
    # так само вміє коректно проксувати API самостійно, а не давати оманливий 200 з HTML.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Fallback для React Router (SPA): пряме відкриття/оновлення сторінок типу
    # /login, /movies/123, /profile тощо не повинно давати 404 від nginx —
    # усі невідомі йому шляхи віддаються на index.html, а маршрутизацію
    # вже бере на себе React Router на клієнті.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кешування статичних asset'ів, згенерованих Vite (мають хеш у імені файлу)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
